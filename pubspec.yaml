name: hotspot_connection
description: "A Flutter plugin for local network peer-to-peer (P2P) discovery and TCP socket communication using native Android NSD and iOS Bonjour."
version: 0.0.1
repository: https://github.com/ipawanghimire/hotspot_connection

environment:
  sdk: ^3.10.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  plugin:
    platforms:
      android:
        package: com.example.hotspot_connection
        pluginClass: HotspotConnectionPlugin
      ios:
        pluginClass: HotspotConnectionPlugin
